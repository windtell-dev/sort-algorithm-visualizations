<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odd-Even Sort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..600&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<script src="code.js"></script>
<script src="player.js"></script>
<script src="algos/oddevensort.js"></script>
<script>
const { PSEUDO, buildSteps } = ALGOS.oddevensort;

/* ui */
startPlayer({
  title: 'Odd-Even Sort',
  backHref: 'special.html',
  backLabel: 'Other special sorts',
  pseudo: PSEUDO,
  code: LISTINGS.oddevensort,
  initial: '38, 27, 43, 3, 9, 82, 10, 15, 1, 56',
  parse(text) { const list = parseList(text); return list ? { data: list, text: list.join(', ') } : { error: LIST_ERROR }; },
  build: buildSteps,
  overview: overviewFromPasses,
  check: isSortedRun,
  sections: `
    <section class="card">
      <div class="sec-head">
        <p class="label">Array A, with this phase's pairs</p>
        <ul class="legend">
          <li><i class="l-lo"></i>Pair</li>
          <li><i class="l-hi"></i>Next pair</li>
          <li><i class="l-focus"></i>Being compared or swapped</li>
          <li><i class="l-done"></i>Sorted</li>
        </ul>
      </div>
      <div class="scroll-x"><div class="array" id="arrayA"></div></div>
    </section>
    <section class="card">
      <div class="sec-head"><p class="label">List after each round</p></div>
      <div class="scroll-x"><div class="passes" id="passes"></div></div>
    </section>`,
  render(s) {
    const n = s.A.length;
    $('arrayA').innerHTML = slots(s.A, x => {
      const cls = [], ptr = [];
      if (s.done) cls.push('q-done');
      else if (s.phase !== null && x >= s.phase) {
        const pair = Math.floor((x - s.phase) / 2);
        const left = x - ((x - s.phase) % 2);
        if (left + 1 <= n - 1) cls.push(pair % 2 ? 'q-hi' : 'q-lo');
      }
      if (s.focus.includes(x)) cls.push('q-focus');
      if (x === s.i) ptr.push('i');
      if (s.i !== null && x === s.i + 1) ptr.push('i + 1');
      return { top: x, cls: cls.join(' '), ptr: ptr.join(' ') };
    });
    renderPasses(s);
  },
});
</script>
</body>
</html>
