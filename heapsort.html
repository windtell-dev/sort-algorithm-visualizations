<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heap Sort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..600&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<script src="code.js"></script>
<script src="player.js"></script>
<script src="algos/heapsort.js"></script>
<script>
const { PSEUDO, buildSteps } = ALGOS.heapsort;

/* ui */
startPlayer({
  title: 'Heap Sort',
  pseudo: PSEUDO,
  code: LISTINGS.heapsort,
  initial: '38, 27, 43, 3, 9, 82, 10, 15, 1, 56',
  parse(text) { const list = parseList(text); return list ? { data: list, text: list.join(', ') } : { error: LIST_ERROR }; },
  build: buildSteps,
  overview(r) {
    const rows = [{ label: 'Start', groups: [r.steps[0].A] }];
    const built = r.steps.find(s => s.line === 4);
    rows.push({ label: 'Build the max-heap', groups: [built.A.map((v, i) => i === 0 ? { v, c: 'p' } : v)] });
    r.steps.filter(s => s.line === 5).forEach(s => rows.push({ label: `Move ${s.A[s.sortedFrom]} to index ${s.sortedFrom}`, groups: [s.A.map((v, i) => i >= s.sortedFrom ? { v, c: 'g' } : v)] }));
    rows.push({ label: 'Sorted', groups: [r.steps[r.steps.length - 1].A.map(v => ({ v, c: 'g' }))] });
    return rows;
  },
  check: isSortedRun,
  sections: `
    <section class="card">
      <div class="sec-head">
        <p class="label">Array A</p>
        <ul class="legend">
          <li><i class="l-piv"></i>Parent</li>
          <li><i class="l-hi"></i>Child</li>
          <li><i class="l-focus"></i>Being compared or swapped</li>
          <li><i class="l-done"></i>Final spot</li>
        </ul>
      </div>
      <div class="scroll-x"><div class="array" id="arrayA"></div></div>
    </section>
    <section class="card">
      <div class="sec-head"><p class="label">The same array drawn as a heap</p></div>
      <div class="scroll-x"><div class="graph" id="graph"></div></div>
    </section>`,
  render(s) {
    const cellClass = i => {
      const c = [];
      if (i >= s.sortedFrom) c.push('done');
      else if (i === s.root) c.push('root');
      else if (i === s.child) c.push('child');
      if (s.focus.includes(i)) c.push('focus');
      return c;
    };
    $('arrayA').innerHTML = slots(s.A, i => {
      const map = { done: 'q-done', root: 'q-piv', child: 'q-hi', focus: 'q-focus' };
      const ptr = [];
      if (i === s.root) ptr.push('root');
      if (i === s.child) ptr.push('child');
      return { top: i, cls: cellClass(i).map(c => map[c]).join(' '), ptr: ptr.join(' ') };
    });
    const nodes = s.A.map((v, i) => {
      const level = Math.floor(Math.log2(i + 1)), place = i + 1 - 2 ** level;
      return { x: (place + 0.5) / 2 ** level * 100, y: level * 56, label: v, cls: cellClass(i).join(' ') };
    });
    const edges = s.A.map((_, i) => i ? { a: Math.floor((i - 1) / 2), b: i, off: i >= s.sortedFrom } : null).filter(Boolean);
    renderGraph(nodes, edges);
  },
});
</script>
</body>
</html>
