<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bucket Sort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..600&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<script src="code.js"></script>
<script src="player.js"></script>
<script src="algos/bucketsort.js"></script>
<script>
const { PSEUDO, buildSteps } = ALGOS.bucketsort;

/* ui */
startPlayer({
  title: 'Bucket Sort',
  backHref: 'special.html',
  backLabel: 'Other special sorts',
  pseudo: PSEUDO,
  code: LISTINGS.bucketsort,
  initial: '38, 27, 43, 3, 9, 82, 10, 15, 1, 56',
  parse(text) { const list = parseList(text); return list ? { data: list, text: list.join(', ') } : { error: LIST_ERROR }; },
  build: buildSteps,
  overview(r) {
    const filled = r.steps.find(s => s.line === 7).buckets.filter(b => b.length);
    const last = r.steps[r.steps.length - 1];
    return [
      { label: 'Start', groups: [r.steps[0].A] },
      { label: 'Spread into buckets', groups: filled },
      { label: 'Sort each bucket', groups: last.buckets.filter(b => b.length).map(b => b.map(v => ({ v, c: 'g' }))) },
      { label: 'Join the buckets', groups: [last.A.map(v => ({ v, c: 'g' }))] },
    ];
  },
  check: isSortedRun,
  sections: `
    <section class="card">
      <div class="sec-head">
        <p class="label">Array A</p>
        <ul class="legend">
          <li><i class="l-focus"></i>Just read or written</li>
          <li><i class="l-done"></i>Written back in order</li>
        </ul>
      </div>
      <div class="scroll-x"><div class="array" id="arrayA"></div></div>
    </section>
    <section class="card">
      <div class="sec-head">
        <p class="label">Buckets</p>
        <ul class="legend">
          <li><i class="l-cur"></i>Current bucket</li>
          <li><i class="l-hi"></i>Current value</li>
          <li><i class="l-done"></i>Sorted bucket</li>
        </ul>
      </div>
      <div class="scroll-x"><div class="buckets" id="buckets"></div></div>
    </section>`,
  render(s) {
    $('arrayA').innerHTML = slots(s.A, i => {
      const cls = [], ptr = [];
      if (s.k !== null && i < s.k) cls.push('q-done');
      if (s.focus.includes(i)) cls.push('q-focus');
      if (i === s.i) ptr.push('i');
      if (i === s.k) ptr.push('k');
      return { top: i, cls: cls.join(' '), ptr: ptr.join(' ') };
    });
    const boxes = s.buckets || Array.from({ length: s.A.length }, () => []);
    $('buckets').style.setProperty('--n', boxes.length);
    $('buckets').innerHTML = boxes.map((b, x) => {
      const items = b.map((v, y) => {
        const cls = x === s.active && y === s.item ? 'mark' : x <= s.sortedBuckets ? 'sorted' : '';
        return `<span class="bitem ${cls}">${v}</span>`;
      }).join('');
      return `<div class="bucket ${x === s.active ? 'on' : ''}"><small>${x}</small>${items}</div>`;
    }).join('');
  },
});
</script>
</body>
</html>
