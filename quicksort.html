<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quicksort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..600&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<script src="code.js"></script>
<script src="player.js"></script>
<script src="algos/quicksort.js"></script>
<script>
const { PSEUDO, buildSteps } = ALGOS.quicksort;

/* ui */
startPlayer({
  title: 'Quicksort',
  divideAndConquer: true,
  pseudo: PSEUDO,
  code: LISTINGS.quicksort,
  initial: '38, 27, 43, 3, 9, 82, 10, 15, 1, 56',
  parse(text) { const list = parseList(text); return list ? { data: list, text: list.join(', ') } : { error: LIST_ERROR }; },
  build: buildSteps,
  overview(r) {
    const rows = [{ label: 'Start', groups: [r.steps[0].A] }];
    r.steps.filter(s => s.line === 3 && s.major).forEach(s => {
      const { lo, hi, p } = s.vars;
      rows.push({ label: `Partition A[${lo}..${hi}], pivot ${s.A[p]}`, groups: [s.A.map((v, i) => i === p ? { v, c: 'p' } : i >= lo && i < p ? { v, c: 'b' } : i > p && i <= hi ? { v, c: 'v' } : s.placed.includes(i) ? { v, c: 'g' } : v)] });
    });
    rows.push({ label: 'Sorted', groups: [r.steps[r.steps.length - 1].A.map(v => ({ v, c: 'g' }))] });
    return rows;
  },
  check: isSortedRun,
  sections: `
    <section class="card">
      <div class="sec-head">
        <p class="label">Array A</p>
        <ul class="legend">
          <li><i class="l-lo"></i>At most the pivot</li>
          <li><i class="l-hi"></i>Greater than the pivot</li>
          <li><i class="l-piv"></i>Pivot</li>
          <li><i class="l-done"></i>Final spot</li>
        </ul>
      </div>
      <div class="scroll-x"><div class="array" id="arrayA"></div></div>
    </section>
    <section class="card">
      <div class="sec-head">
        <p class="label">Recursion tree</p>
        <ul class="legend">
          <li><i></i>Waiting on its sides</li>
          <li><i class="l-cur"></i>Current call</li>
          <li><i class="l-merge"></i>Partitioning</li>
          <li><i class="l-done"></i>Sorted</li>
        </ul>
      </div>
      <div class="scroll-x"><div class="tree" id="tree"></div></div>
    </section>`,
  render(s) {
    const scope = s.cur && run.nodes.find(n => n.key === s.cur);
    $('arrayA').innerHTML = slots(s.A, i => {
      const cls = [], p = s.part, ptr = [];
      if (p && i >= p.lo && i <= p.hi) {
        if (i === p.pivotAt) cls.push('q-piv');
        else if (i <= p.i) cls.push('q-lo');
        else if (i < p.seen) cls.push('q-hi');
        else cls.push('scope');
        if (i === p.i) ptr.push('i');
        if (i === p.j) ptr.push('j');
        if (i === p.pivotAt) ptr.push('pivot');
      } else if (s.placed.includes(i)) cls.push('q-done');
      else if (scope && i >= scope.lo && i <= scope.hi) cls.push('scope');
      if (s.focus.includes(i)) cls.push('q-focus');
      return { top: i, cls: cls.join(' '), ptr: ptr.join(' ') };
    });
    renderTree(s, (node, st, c) => st.state !== 'done' && st.p !== null && node.lo + c === st.p ? 'piv' : '');
  },
});
</script>
</body>
</html>
